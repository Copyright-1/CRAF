# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Build and upload Artifact

on:
  push:
    # Звездочка '**' заставляет workflow запускаться при пуше в ЛЮБУЮ ветку репозитория
    branches: [ "main", "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Меняем на write, чтобы джоба могла создать релиз при пуше в main
      contents: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle Wrapper
      run: ./gradlew buildMod

    # Шаг публикации релиза. Выполнится только если пуш был именно в ветку main
    - name: Create Release and Publish
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        # Автоматически генерирует имя тега на основе даты/времени, если тега нет (например, run-452391)
        tag_name: build-\${{ github.run_number }}
        name: Release Build \${{ github.run_number }}
        body: |
          Автоматический релиз из ветки `main`.
          Статус сборки: Успешно.
        generate_release_notes: true
        # Укажите путь к файлу вашего мода. Замените *.jar на точное имя, если нужно
        files: |
          build/libs/*.jar
      env:
        GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}

  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
